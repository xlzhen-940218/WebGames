<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2048 - WebGames</title>
    <style>
        :root {
            --board: #bbada0;
            --empty: rgba(238, 228, 218, 0.35);
            --text: #776e65;
            --light: #f9f6f2;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px 16px 40px;
            background: #faf8ef;
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
        }
        .game-shell { width: min(100%, 500px); margin: 0 auto; }
        .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
        h1 { margin: 0; color: #776e65; font-size: clamp(42px, 13vw, 72px); line-height: 1; }
        .scores { display: flex; gap: 8px; }
        .score-box {
            min-width: 76px; padding: 7px 12px; border-radius: 4px;
            background: #bbada0; color: var(--light); text-align: center;
            font-size: 11px; font-weight: bold; text-transform: uppercase;
        }
        .score-box strong { display: block; font-size: 22px; line-height: 1.15; }
        .intro { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 18px 0 12px; }
        .intro p { margin: 0; font-size: 15px; line-height: 1.4; }
        button {
            border: 0; border-radius: 4px; padding: 11px 15px; color: #fff;
            background: #8f7a66; cursor: pointer; font-weight: bold; white-space: nowrap;
        }
        button:hover, button:focus-visible { background: #776452; }
        .board-wrap { position: relative; }
        #board {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
            padding: 12px; border-radius: 6px; background: var(--board);
            touch-action: none; user-select: none;
        }
        .tile {
            display: flex; align-items: center; justify-content: center;
            aspect-ratio: 1; border-radius: 4px; background: var(--empty);
            color: var(--text); font-size: clamp(26px, 9vw, 48px); font-weight: bold;
            transition: background-color .12s, transform .12s;
        }
        .tile:not(.empty) { background: #eee4da; }
        .tile[data-value="2"] { background: #eee4da; }
        .tile[data-value="4"] { background: #ede0c8; }
        .tile[data-value="8"] { background: #f2b179; color: #f9f6f2; }
        .tile[data-value="16"] { background: #f59563; color: #f9f6f2; }
        .tile[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
        .tile[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
        .tile[data-value="128"], .tile[data-value="256"] { background: #edcf72; color: #f9f6f2; font-size: clamp(22px, 7vw, 38px); }
        .tile[data-value="512"], .tile[data-value="1024"], .tile[data-value="2048"] { background: #edc53f; color: #f9f6f2; font-size: clamp(18px, 6vw, 32px); }
        .message {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 14px;
            border-radius: 6px; background: rgba(250, 248, 239, .78); text-align: center;
        }
        .message h2 { margin: 0; font-size: 42px; }
        .message p { margin: 0; font-size: 18px; }
        .message[hidden] { display: none; }
        .actions { display: flex; justify-content: center; gap: 10px; margin-top: 14px; }
        .actions button:disabled { opacity: .45; cursor: not-allowed; }
        .help { margin: 22px 0 0; text-align: center; font-size: 13px; color: #8b8178; }
        .back { display: inline-block; margin-top: 18px; color: #8f7a66; font-weight: bold; text-decoration: none; }
        @media (max-width: 380px) {
            #board { gap: 8px; padding: 8px; }
            .intro { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
    <main class="game-shell">
        <div class="topbar">
            <h1>2048</h1>
            <div class="scores" aria-label="游戏分数">
                <div class="score-box">分数<strong id="score">0</strong></div>
                <div class="score-box">最高<strong id="best">0</strong></div>
            </div>
        </div>
        <div class="intro">
            <p>合并相同数字，努力得到 <strong>2048</strong>！</p>
            <button id="newGame" type="button">重新开始</button>
        </div>
        <div class="board-wrap">
            <div id="board" role="grid" aria-label="2048 游戏棋盘"></div>
            <div id="message" class="message" hidden>
                <h2 id="messageTitle">你赢了！</h2>
                <p id="messageText">继续挑战更高分吧</p>
                <button id="continueGame" type="button">继续游戏</button>
            </div>
        </div>
        <div class="actions">
            <button id="undo" type="button" disabled>撤销一步</button>
        </div>
        <p class="help">使用方向键或 WASD 移动，手机上也可以滑动棋盘</p>
        <a class="back" href="../index.html">← 返回游戏首页</a>
    </main>
    <script>
        const SIZE = 4;
        const boardElement = document.getElementById('board');
        const scoreElement = document.getElementById('score');
        const bestElement = document.getElementById('best');
        const messageElement = document.getElementById('message');
        const messageTitle = document.getElementById('messageTitle');
        const messageText = document.getElementById('messageText');
        const continueButton = document.getElementById('continueGame');
        const undoButton = document.getElementById('undo');
        let board = [];
        let score = 0;
        let best = Number(localStorage.getItem('webgames-2048-best')) || 0;
        let previousState = null;
        let won = false;
        let touchStart = null;

        function emptyBoard() { return Array.from({ length: SIZE }, () => Array(SIZE).fill(0)); }
        function addRandomTile() {
            const empty = [];
            board.forEach((row, r) => row.forEach((value, c) => { if (!value) empty.push([r, c]); }));
            if (!empty.length) return;
            const [r, c] = empty[Math.floor(Math.random() * empty.length)];
            board[r][c] = Math.random() < 0.9 ? 2 : 4;
        }
        function render() {
            boardElement.innerHTML = '';
            board.forEach(row => row.forEach(value => {
                const tile = document.createElement('div');
                tile.className = `tile${value ? '' : ' empty'}`;
                tile.dataset.value = value || '';
                tile.textContent = value || '';
                tile.setAttribute('role', 'gridcell');
                tile.setAttribute('aria-label', value ? `数字 ${value}` : '空格');
                boardElement.appendChild(tile);
            }));
            scoreElement.textContent = score;
            bestElement.textContent = best;
            undoButton.disabled = !previousState;
        }
        function saveState() {
            previousState = { board: board.map(row => row.slice()), score };
        }
        function move(direction) {
            const vectors = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };
            const [dr, dc] = vectors[direction];
            const next = emptyBoard();
            let changed = false;
            let gained = 0;
            for (let line = 0; line < SIZE; line++) {
                const values = [];
                for (let step = 0; step < SIZE; step++) {
                    const r = dr === 0 ? line : (dr === 1 ? SIZE - 1 - step : step);
                    const c = dc === 0 ? line : (dc === 1 ? SIZE - 1 - step : step);
                    if (board[r][c]) values.push(board[r][c]);
                }
                const merged = [];
                for (let i = 0; i < values.length; i++) {
                    if (values[i] === values[i + 1]) {
                        const value = values[i] * 2;
                        merged.push(value); gained += value; i++;
                    } else merged.push(values[i]);
                }
                while (merged.length < SIZE) merged.push(0);
                for (let step = 0; step < SIZE; step++) {
                    const r = dr === 0 ? line : (dr === 1 ? SIZE - 1 - step : step);
                    const c = dc === 0 ? line : (dc === 1 ? SIZE - 1 - step : step);
                    next[r][c] = merged[step];
                    if (next[r][c] !== board[r][c]) changed = true;
                }
            }
            if (!changed) return;
            saveState();
            board = next; score += gained; addRandomTile();
            if (score > best) { best = score; localStorage.setItem('webgames-2048-best', best); }
            render();
            if (!won && board.some(row => row.includes(2048))) {
                won = true; showMessage('你赢了！', '太棒了，你已经合成 2048。');
            } else if (!canMove()) showMessage('游戏结束', '没有可以移动的方块了。', false);
        }
        function canMove() {
            for (let r = 0; r < SIZE; r++) for (let c = 0; c < SIZE; c++) {
                if (!board[r][c] || board[r][c] === board[r + 1]?.[c] || board[r][c] === board[r]?.[c + 1]) return true;
            }
            return false;
        }
        function showMessage(title, text, canContinue = true) {
            messageTitle.textContent = title; messageText.textContent = text;
            continueButton.hidden = !canContinue; messageElement.hidden = false;
        }
        function newGame() {
            board = emptyBoard(); score = 0; previousState = null; won = false;
            messageElement.hidden = true; addRandomTile(); addRandomTile(); render();
        }
        document.addEventListener('keydown', event => {
            const keys = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down', a: 'left', d: 'right', w: 'up', s: 'down' };
            const direction = keys[event.key];
            if (direction) { event.preventDefault(); move(direction); }
        });
        boardElement.addEventListener('touchstart', event => { touchStart = event.changedTouches[0]; }, { passive: true });
        boardElement.addEventListener('touchend', event => {
            if (!touchStart) return;
            const touch = event.changedTouches[0];
            const dx = touch.clientX - touchStart.clientX, dy = touch.clientY - touchStart.clientY;
            touchStart = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 25) return;
            move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        }, { passive: true });
        document.getElementById('newGame').addEventListener('click', newGame);
        continueButton.addEventListener('click', () => { messageElement.hidden = true; });
        undoButton.addEventListener('click', () => {
            if (!previousState) return;
            board = previousState.board; score = previousState.score; previousState = null;
            messageElement.hidden = true; render();
        });
        newGame();
    </script>
</body>
</html>
